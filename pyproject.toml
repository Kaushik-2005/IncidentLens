[project]
name = "incidentlens"
version = "0.1.0"
description = "Learning project for a multi-agent incident investigation assistant."
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-google-genai>=4.0",
    "langgraph>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: tests that call the configured external Gemini API"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

